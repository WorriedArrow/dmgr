[workspace]
resolver = "3"
members = ["crates/dmgr", "crates/dmgr-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/worriedarrow/dmgr"
authors = ["dmgr contributors"]

[workspace.dependencies]
dmgr = { path = "crates/dmgr", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
